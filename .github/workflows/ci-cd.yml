name: ShareMoney CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. BACKEND CI (Spring Boot 17 + Maven)
  # ==========================================
  backend-ci:
    name: ☕ Backend CI (Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 🔑 Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: 🧪 Run Backend Unit & Integration Tests
        run: ./mvnw clean test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: 📦 Package JAR Application
        run: ./mvnw package -DskipTests -B

      - name: 💾 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharemoney-backend-jar
          path: target/*.jar
          retention-days: 7

  # ==========================================
  # 2. FRONTEND CI (React Native / Expo)
  # ==========================================
  frontend-ci:
    name: 📱 Frontend CI (TypeCheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./FrontendReact

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './FrontendReact/package-lock.json'

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔍 TypeScript Strict Type Check
        run: npx tsc --noEmit

  # ==========================================
  # 3. DOCKER BUILD & DEPLOY (CD)
  # ==========================================
  deploy-cd:
    name: 🚀 Continuous Deployment (Docker & Cloud)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Verify Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sharemoney-backend:latest

      # Trigger Render.com Webhook Auto-Deploy (nếu có Secret RENDER_DEPLOY_HOOK)
      - name: 🌐 Trigger Cloud Deploy (Render.com)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering deployment on Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
