<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ShareMoney AI Mascot</title>
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts for better typography match -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <style data-purpose="custom-styles">
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
        }

        .status-bar-bg {
            background-color: #a7d7c5;
            /* Matching the top pastel green */
        }

        .main-gradient-bg {
            background: linear-gradient(to bottom, #a7d7c5 0%, #a7d7c5 20%, #f3f4f6 20%, #f3f4f6 100%);
        }

        .nav-active-shadow {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .floating-action-btn {
            box-shadow: 0 4px 12px rgba(100, 210, 180, 0.4);
        }
    </style>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="flex justify-center items-center min-h-screen">
    <!-- Mobile Container -->
    <div class="relative w-full max-w-[390px] h-[844px] bg-[#f8faf9] overflow-hidden flex flex-col shadow-2xl">
        <!-- BEGIN: Header Section -->
        <header class="w-full pt-4 px-6 pb-12 status-bar-bg" data-purpose="app-header">
            <!-- iOS Status Bar Mock (Simplified) -->
            <div class="flex justify-between items-center text-xs font-semibold mb-6">
                <span>San</span>
                <div class="flex items-center space-x-4">
                    <span>8:40 PM</span>
                    <div class="flex items-center">
                        <span class="mr-1">98%</span>
                        <svg class="w-5 h-2.5" fill="currentColor" viewbox="0 0 20 10">
                            <rect fill="none" height="10" rx="2" stroke="currentColor" stroke-width="1" width="18">
                            </rect>
                            <rect fill="currentColor" height="6" rx="1" width="10" x="2" y="2"></rect>
                        </svg>
                    </div>
                </div>
            </div>
            <!-- App Title & Notification -->
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">ShareMoney</h1>
                <button aria-label="Notifications" class="relative">
                    <svg class="h-7 w-7 text-gray-700" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <span class="absolute top-1 right-1 block h-2 w-2 rounded-full bg-red-500 ring-2 ring-white"></span>
                </button>
            </div>
        </header>
        <!-- END: Header Section -->
        <!-- BEGIN: Main Content / Modal Overlay -->
        <main class="flex-grow relative -mt-6 px-4 z-10" data-purpose="modal-content">
            <!-- Background Content Simulation (Blurred cards in background) -->
            <div class="absolute inset-0 px-4 -z-10 opacity-30">
                <div class="h-32 bg-white rounded-3xl mb-4 shadow-sm"></div>
                <div class="h-32 bg-white rounded-3xl mb-4 shadow-sm"></div>
            </div>
            <!-- AI Debt Reminder Card -->
            <div class="bg-white rounded-[40px] shadow-xl p-6 flex flex-col items-center border border-gray-100"
                data-purpose="ai-reminder-card">
                <h2 class="text-xl font-extrabold text-gray-900 mb-6">AI Debt Reminder Mascot</h2>
                <!-- Mascot Illustration -->
                <div class="w-48 h-48 mb-6" data-purpose="mascot-container">
                    <img alt="AI Mascot" class="w-full h-full object-contain"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwNC5COVHkCirsGlRKmATw6sbVEoX31ximA8w9KyXPvRI2KTayLs-n4mOfER8qTzrtgiiTfdDy2LN1Pe8MKAmYwat0Zf7cxbekkqSJGqOZn0M8tzLB8mql1Q3UPlFHPUlqTbYs0lOWVA9HCLGoSZA8uBWgG96L0F_xqhI7efkS8gNjXEvsFhsEqNZVtVrtsNEGqUb2OrhNUDlHt5QMQyG9NYctAQaemjpwqdsEjBy4v_f38fof1k32oeqK57tzqb0RoIqZgZ2ydiQ"
                        style="object-position: center top; height: 180px; object-fit: contain;" />
                </div>
                <!-- Tabbed Navigation Inside Card -->
                <div class="grid grid-cols-3 w-full bg-[#f2f4f7] rounded-2xl p-1 mb-6" data-purpose="feature-tabs">
                    <!-- Active Tab: Lịch sử -->
                    <button
                        class="flex flex-col items-center justify-center py-3 bg-white rounded-xl nav-active-shadow"><span
                            class="material-symbols-outlined text-2xl mb-1 text-gray-800">handshake</span>
                        <span class="text-xs font-semibold text-gray-800">Lịch sử</span></button>
                    <!-- Inactive Tab: Khía cực mạnh -->
                    <button class="flex flex-col items-center justify-center py-3">
                        <svg class="w-6 h-6 mb-1 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                        <span class="text-xs font-medium text-gray-600">Khía cực mạnh</span>
                    </button>
                    <!-- Inactive Tab: Thơ lục bát -->
                    <button class="flex flex-col items-center justify-center py-3">
                        <svg class="w-6 h-6 mb-1 text-gray-600" fill="none" stroke="currentColor" viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                        <span class="text-xs font-medium text-gray-600">Thơ lục bát</span>
                    </button>
                </div>
                <!-- Notification Content Area -->
                <div class="w-full bg-[#f1f3f6] rounded-2xl p-4 mb-6" data-purpose="message-box">
                    <p class="text-[15px] leading-relaxed text-gray-800 font-medium">
                        Chào [Tên], mình thấy có khoản chi tiêu chung chưa được thanh toán. Mong bạn sớm kiểm tra nhé!
                    </p>
                </div>
                <!-- Primary Action Button -->
                <button
                    class="w-full bg-[#70d6b6] hover:bg-[#5fc0a3] text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center transition-all active:scale-95"
                    data-purpose="send-reminder-btn">
                    Phát Lệnh Nhắc Nợ 🚀
                </button>
            </div>
        </main>
        <!-- END: Main Content -->
        <!-- BEGIN: Bottom Navigation -->
        <footer class="bg-white border-t border-gray-100 h-24 pb-6 flex items-center justify-between px-6 relative"
            data-purpose="bottom-nav">
            <!-- Nav Item 1 -->
            <div class="flex flex-col items-center">
                <svg class="w-7 h-7 text-[#70d6b6]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span class="text-[10px] mt-1 text-[#70d6b6] font-semibold">Dashboard</span>
            </div>
            <!-- Nav Item 2 -->
            <div class="flex flex-col items-center">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span class="text-[10px] mt-1 text-gray-400 font-medium">Tên lệnh</span>
            </div>
            <!-- Floating Action Button Placeholder Space -->
            <div class="w-16"></div>
            <!-- Center FAB -->
            <div class="absolute -top-6 left-1/2 -translate-x-1/2">
                <button
                    class="bg-[#70d6b6] text-white w-16 h-16 rounded-full flex items-center justify-center floating-action-btn border-[5px] border-[#f8faf9] text-3xl font-light">
                    +
                </button>
            </div>
            <!-- Nav Item 3 -->
            <div class="flex flex-col items-center">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span class="text-[10px] mt-1 text-gray-400 font-medium">Biết lặng</span>
            </div>
            <!-- Nav Item 4 -->
            <div class="flex flex-col items-center">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                        stroke-linejoin="round" stroke-width="2"></path>
                </svg>
                <span class="text-[10px] mt-1 text-gray-400 font-medium">Như nhựt</span>
            </div>
        </footer>
        <!-- END: Bottom Navigation -->
        <!-- Home Indicator (iOS) -->
        <div class="w-32 h-1.5 bg-gray-200 rounded-full mx-auto mb-2 absolute bottom-2 left-1/2 -translate-x-1/2"></div>
    </div>
</body>

</html>
