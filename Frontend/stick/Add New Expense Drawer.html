<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ShareMoney - Add New Expense</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mint-green': '#a8d5ba',
                        'mint-dark': '#8bc3a1',
                        'brand-green': '#5eb291',
                        'soft-red': '#f8d7da',
                        'soft-blue': '#d1ecf1',
                    }
                }
            }
        }
    </script>
    <style data-purpose="custom-styling">
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #8bc3a1;
            /* Mint green matching mockup */
        }

        .modal-shadow {
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
        }

        .input-focus-ring:focus-within {
            border-color: #5eb291;
            box-shadow: 0 0 0 1px #5eb291;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <!-- BEGIN: Mobile Container -->
    <div
        class="relative w-full max-w-md bg-transparent h-[795px] flex flex-col items-center justify-end overflow-hidden">
        <!-- BEGIN: Header Title (ShareMoney) -->
        <header class="absolute top-4 w-full text-center">
            <h1 class="text-white text-2xl font-bold">ShareMoney</h1>
        </header>
        <!-- END: Header Title -->
        <!-- BEGIN: Add Expense Drawer -->
        <main
            class="bg-white w-full h-[88%] rounded-t-[40px] rounded-b-[30px] p-6 pb-8 modal-shadow flex flex-col overflow-y-auto hide-scrollbar"
            data-purpose="expense-drawer">
            <!-- Handle bar -->
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-6"></div>
            <h2 class="text-center text-xl font-semibold text-gray-700 mb-6">Thêm khoản chi mới</h2>
            <!-- BEGIN: Amount Input -->
            <section class="mb-6">
                <div class="border-2 border-mint-green rounded-2xl p-4 flex items-center justify-center space-x-2">
                    <span class="text-4xl font-bold text-gray-800">250,000</span>
                    <span class="text-gray-400 font-medium">VND</span>
                    <div class="w-[2px] h-10 bg-blue-500 animate-pulse ml-1"></div> <!-- Cursor -->
                </div>
            </section>
            <!-- END: Amount Input -->
            <!-- BEGIN: Expense Details -->
            <section class="space-y-3 mb-6">
                <!-- Expense Name -->
                <div class="flex items-center border border-gray-200 rounded-2xl p-3 bg-white">
                    <div class="w-10 h-10 rounded-xl overflow-hidden mr-3"><img alt="Shopping Bag"
                            class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                            style="object-position: 20% 15%; transform: scale(2.2);" /></div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400">Tên khoản chi</span>
                        <span class="text-gray-800 font-medium">Ăn Tối Lẩu</span>
                    </div>
                </div>
                <!-- Category -->
                <div class="flex items-center border border-gray-200 rounded-2xl p-3 bg-white">
                    <div class="w-10 h-10 rounded-xl overflow-hidden mr-3"><img alt="Cutlery"
                            class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                            style="object-position: 80% 15%; transform: scale(2.2);" /></div>
                    <div class="flex flex-col">
                        <span class="text-xs text-gray-400">Danh mục</span>
                        <span class="text-gray-800 font-medium">Ăn uống</span>
                    </div>
                </div>
            </section>
            <!-- END: Expense Details -->
            <!-- BEGIN: Payer Selection -->
            <section class="mb-6">
                <h3 class="text-gray-800 font-bold mb-3">Ai trả tiền?</h3>
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div class="w-10 h-10 rounded-full border border-gray-200 overflow-hidden"><img alt="Bạn"
                                class="w-full h-full object-cover"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                                style="object-position: 18% 88%; transform: scale(2.5);" /></div>
                        <div
                            class="absolute -bottom-1 -right-1 bg-teal-400 text-white rounded-full p-0.5 border border-white">
                            <svg class="h-3 w-3" fill="currentColor" viewbox="0 0 20 20"
                                xmlns="http://www.w3.org/2000/svg">
                                <path clip-rule="evenodd"
                                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                    fill-rule="evenodd"></path>
                            </svg>
                        </div>
                    </div>
                    <span class="text-gray-700 font-medium">Bạn</span>
                </div>
            </section>
            <!-- END: Payer Selection -->
            <!-- BEGIN: Split Method -->
            <section class="mb-4">
                <h3 class="text-gray-800 font-bold mb-3">Chia như thế nào?</h3>
                <div class="bg-mint-green/30 p-1 rounded-xl flex justify-between">
                    <button class="flex-1 py-2 text-sm font-medium text-gray-600">Equal</button>
                    <button
                        class="flex-1 py-2 text-sm font-bold text-gray-800 bg-white rounded-lg shadow-sm">Manual</button>
                    <button class="flex-1 py-2 text-sm font-medium text-gray-600">Percentage</button>
                </div>
            </section>
            <!-- END: Split Method -->
            <!-- BEGIN: Split Progress -->
            <section class="mb-6">
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-400 font-medium">100%</span>
                    <span class="text-green-500 font-medium">Đã khớp 100%</span>
                </div>
                <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                    <div class="bg-green-500 h-full w-full"></div>
                </div>
            </section>
            <!-- END: Split Progress -->
            <!-- BEGIN: Participant List -->
            <section class="space-y-4 mb-10">
                <!-- Participant 1 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden"><img alt="Bạn"
                                class="w-full h-full object-cover"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                                style="object-position: 18% 88%; transform: scale(2.5);" /></div>
                        <span class="text-gray-700 font-medium">Bạn</span>
                    </div>
                    <div class="border border-gray-200 rounded-xl px-4 py-2 flex items-center min-w-[140px]">
                        <span class="text-gray-800 font-medium mr-1">100,000</span>
                        <span class="text-[10px] text-gray-400">VND</span>
                    </div>
                </div>
                <!-- Participant 2 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden"><img alt="Linh"
                                class="w-full h-full object-cover"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                                style="object-position: 50% 88%; transform: scale(2.5);" /></div>
                        <span class="text-gray-700 font-medium">Linh</span>
                    </div>
                    <div class="border border-gray-200 rounded-xl px-4 py-2 flex items-center min-w-[140px]">
                        <span class="text-gray-800 font-medium mr-1">75,000</span>
                        <span class="text-[10px] text-gray-400">VND</span>
                    </div>
                </div>
                <!-- Participant 3 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full overflow-hidden"><img alt="Huy"
                                class="w-full h-full object-cover"
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDapExLVGBF6k_ScP77HM7nRkZw3H670AAPGhFWw7wxPUc-WhX88e3fkYr241PyhBVruXbtG6ublztSA9e-zp9qTqMdRZPJo5FayN956ploksLa1pDtEpInqjovPy3wGjT0yVIP2vUuMJPhK0mn2JsMofEPmFRzMmoRIW0YYE-zPvF9o8fNnSRJJN9MkKU4tOBzc2Ehty9tsLbTQ_NmB4XU5Cymja5XNaM_dO-G7rtvk6COCgXNTt67yEqyIsLTGx_ftUxM2Avb_Pg"
                                style="object-position: 82% 88%; transform: scale(2.5);" /></div>
                        <span class="text-gray-700 font-medium">Huy</span>
                    </div>
                    <div class="border border-gray-200 rounded-xl px-4 py-2 flex items-center min-w-[140px]">
                        <span class="text-gray-800 font-medium mr-1">75,000</span>
                        <span class="text-[10px] text-gray-400">VND</span>
                    </div>
                </div>
            </section>
            <!-- END: Participant List -->
            <!-- BEGIN: Action Button -->
            <footer class="mt-auto pb-4">
                <button
                    class="w-full bg-mint-dark hover:bg-brand-green transition-colors text-white font-bold py-4 rounded-3xl text-lg">
                    Tạo Khoản Chi
                </button>
            </footer>
            <!-- END: Action Button -->
        </main>
        <!-- END: Add Expense Drawer -->
    </div>
    <!-- END: Mobile Container -->
</body>

</html>
