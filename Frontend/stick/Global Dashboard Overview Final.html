<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bento Grid Finance App</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <style data-purpose="custom-config">
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf6ee;
        }

        .main-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: #fdf6ee;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .ios-status-bar-blur {
            backdrop-filter: blur(10px);
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-green': '#65d5b1',
                        'brand-orange': '#ffbd90',
                        'text-primary': '#1a1a1a',
                        'text-secondary': '#666666',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="antialiased">
    <div class="main-container flex flex-col pb-24">
        <!-- BEGIN: StatusBar -->
        <header
            class="sticky top-0 z-50 bg-[#fdf6ee]/80 ios-status-bar-blur px-8 pt-4 pb-2 flex justify-between items-center"
            data-purpose="status-bar">
            <div class="text-[15px] font-semibold">9:41</div>
            <div class="flex items-center space-x-1.5">
                <!-- Cellular Icon -->
                <svg class="w-4.5 h-3" fill="currentColor" viewbox="0 0 18 12">
                    <path d="M1 10h2v2H1v-2zm4-3h2v5H5V7zm4-3h2v8H9V4zm4-3h2v11h-2V1z"></path>
                </svg>
                <!-- Wifi Icon -->
                <svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24">
                    <path d="M12 21l-12-12c4.4-4.4 11.6-4.4 16 0l4.4 4.4-8.4 7.6z"></path>
                </svg>
                <!-- Battery Icon -->
                <div class="w-6 h-3 border border-black/30 rounded-sm p-[1px] relative">
                    <div class="bg-black h-full w-4/5 rounded-[1px]"></div>
                    <div class="absolute -right-1 top-1/2 -translate-y-1/2 w-0.5 h-1 bg-black/30 rounded-full"></div>
                </div>
            </div>
        </header>
        <!-- END: StatusBar -->
        <!-- BEGIN: UserGreeting -->
        <section class="px-6 mt-6 flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-[#dcfce7] overflow-hidden flex items-center justify-center">
                <div class="w-full h-full flex items-center justify-center text-3xl">👦🏻</div>
            </div>
            <h1 class="text-2xl font-bold text-text-primary">Chào ngày mới, Hải 👋</h1>
        </section>
        <!-- END: UserGreeting -->
        <!-- BEGIN: BentoGrid -->
        <section class="px-6 mt-8">
            <h2 class="text-xl font-bold mb-4">Bento Grid</h2>
            <div class="grid grid-cols-2 gap-4">
                <!-- Income Card -->
                <div class="aspect-[4/5] rounded-[32px] p-5 flex flex-col items-center justify-between card-shadow"
                    data-purpose="card-income" style="background: linear-gradient(135deg, #c3f4e1 0%, #a0ead5 100%);">
                    <span class="text-[15px] font-medium text-black/70">Tiền đang bay về</span>
                    <div class="text-center">
                        <span class="text-2xl font-bold text-text-primary">+1,500,000đ</span>
                    </div>
                    <div class="w-14 h-14 flex items-center justify-center text-4xl">
                        💰 <!-- Represents money bag icon -->
                    </div>
                </div>
                <!-- Expense Card -->
                <div class="aspect-[4/5] rounded-[32px] p-5 flex flex-col items-center justify-between card-shadow"
                    data-purpose="card-expense" style="background: linear-gradient(135deg, #ffe8cc 0%, #ffc099 100%);">
                    <span class="text-[15px] font-medium text-black/70">Tiền cần trả</span>
                    <div class="text-center">
                        <span class="text-2xl font-bold text-text-primary">-300,000đ</span>
                    </div>
                    <div class="w-14 h-14 flex items-center justify-center text-4xl">
                        😩 <!-- Represents sad face icon -->
                    </div>
                </div>
            </div>
        </section>
        <!-- END: BentoGrid -->
        <!-- BEGIN: GlobalActivity -->
        <section class="px-6 mt-10">
            <h2 class="text-xl font-bold mb-4">Global activity</h2>
            <div class="flex flex-col gap-4">
                <!-- Activity Row 1 -->
                <div class="bg-white rounded-full py-4 px-6 flex items-center justify-between card-shadow">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#fff4e5] flex items-center justify-center text-2xl">😋
                        </div>
                        <span class="text-[15px] font-medium text-text-primary">Đã trả cho Linh (🍕 Ăn trưa)</span>
                    </div>
                    <span class="text-[15px] font-semibold text-[#e57373]">-75,000đ</span>
                </div>
                <!-- Activity Row 2 -->
                <div class="bg-white rounded-full py-4 px-6 flex items-center justify-between card-shadow">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-[#eef2ff] flex items-center justify-center text-2xl">🙂
                        </div>
                        <span class="text-[15px] font-medium text-text-primary">Nhận từ Nam (🚕 Taxi)</span>
                    </div>
                    <span class="text-[15px] font-semibold text-[#65d5b1]">+50,000đ</span>
                </div>
                <!-- Activity Row 3 -->
                <div class="bg-white rounded-full py-4 px-6 flex items-center gap-3 card-shadow">
                    <div class="w-10 h-10 rounded-full bg-[#f0fdf4] flex items-center justify-center">
                        <svg class="w-5 h-5 text-brand-green" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </div>
                    <span class="text-[15px] font-medium text-text-primary">Thêm vào nhóm “Chuyến đi Đà Lạt” (⛰️)</span>
                </div>
            </div>
        </section>
        <!-- END: GlobalActivity -->
        <!-- BEGIN: FloatingActionButton -->
        <div class="fixed bottom-24 right-6 z-40">
            <button
                class="flex items-center gap-2 px-6 py-3.5 rounded-full text-text-primary font-bold shadow-lg transition-transform active:scale-95"
                style="background: linear-gradient(90deg, #8fe0d1 0%, #ffbc85 100%);">
                <span>Ghi Bill Nhanh</span>
                <span class="text-xl">✍️</span>
            </button>
        </div>
        <!-- END: FloatingActionButton -->
        <!-- BEGIN: BottomNavigation -->
        <nav
            class="fixed bottom-0 left-0 right-0 max-w-[430px] mx-auto bg-white border-t border-gray-100 px-8 py-4 flex justify-between items-center rounded-t-[35px] shadow-[0_-5px_15px_rgba(0,0,0,0.02)]">
            <!-- Home Active -->
            <a class="flex flex-col items-center gap-1 group" href="#">
                <div class="p-1.5 rounded-lg bg-[#f0fdfa]">
                    <svg class="w-6 h-6 text-brand-green" fill="currentColor" viewbox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
                    </svg>
                </div>
                <span class="text-xs font-bold text-brand-green">Tổng quan</span>
            </a>
            <!-- Community -->
            <a class="flex flex-col items-center gap-1" href="#">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                    viewbox="0 0 24 24">
                    <path
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </a>
            <!-- Analytics -->
            <a class="flex flex-col items-center gap-1" href="#">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                    viewbox="0 0 24 24">
                    <path
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </a>
            <!-- Profile -->
            <a class="flex flex-col items-center gap-1" href="#">
                <svg class="w-7 h-7 text-gray-400" fill="none" stroke="currentColor" stroke-width="2"
                    viewbox="0 0 24 24">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                </svg>
            </a>
        </nav>
        <!-- END: BottomNavigation -->
        <!-- iPhone Home Indicator -->
        <div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-black rounded-full pointer-events-none">
        </div>
    </div>
</body>

</html>
