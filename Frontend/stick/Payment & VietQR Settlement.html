<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Settle Up - Payment Screen</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mint-bg': '#E6F7F1',
                        'mint-primary': '#7CD6BD',
                        'mint-light': '#D1F0E6',
                        'text-dark': '#333333',
                        'text-muted': '#666666',
                    },
                    borderRadius: {
                        '4xl': '2.5rem',
                    },
                    animation: {
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style data-purpose="background-pattern">
        /* Subtle sprinkle pattern overlay */
        .sprinkle-pattern {
            background-image:
                radial-gradient(circle at 20% 10%, #FFD1D1 4px, transparent 4px),
                radial-gradient(circle at 80% 15%, #D1F0E6 6px, transparent 6px),
                radial-gradient(circle at 50% 5%, #FFECB3 5px, transparent 5px),
                radial-gradient(circle at 10% 40%, #B3E5FC 4px, transparent 4px),
                radial-gradient(circle at 90% 45%, #FFD1D1 5px, transparent 5px),
                radial-gradient(circle at 30% 60%, #FFECB3 6px, transparent 6px),
                radial-gradient(circle at 70% 80%, #B3E5FC 5px, transparent 5px),
                radial-gradient(circle at 15% 90%, #FFD1D1 4px, transparent 4px),
                radial-gradient(circle at 85% 95%, #D1F0E6 6px, transparent 6px);
            background-size: 400px 600px;
        }
    </style>
    <style data-purpose="pulse-animation">
        /* Custom pulsing circles animation for the "Waiting for payment" indicator */
        .pulse-ring {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .pulse-ring div {
            position: absolute;
            border: 2px solid #7CD6BD;
            opacity: 1;
            border-radius: 50%;
            animation: ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }

        .pulse-ring div:nth-child(2) {
            animation-delay: -0.5s;
        }

        @keyframes ripple {
            0% {
                top: 40px;
                left: 40px;
                width: 0;
                height: 0;
                opacity: 1;
            }

            100% {
                top: 0;
                left: 0;
                width: 80px;
                height: 80px;
                opacity: 0;
            }
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-mint-bg sprinkle-pattern min-h-screen flex items-center justify-center p-4">
    <!-- BEGIN: MainContainer -->
    <main class="w-full max-w-md bg-white rounded-4xl overflow-hidden border border-white/50 shadow-xl"
        data-purpose="payment-card">
        <!-- BEGIN: Header -->
        <header class="px-6 pt-8 pb-4 flex items-center justify-between" data-purpose="header">
            <button class="p-2 text-gray-400 hover:text-gray-600"><span
                    class="material-symbols-outlined text-gray-500">close</span></button>
            <h1 class="text-xl font-bold text-text-dark">Settle Up</h1>
            <button class="p-2 text-gray-400 hover:text-gray-600"><span
                    class="material-symbols-outlined text-gray-500">help</span></button>
        </header>
        <!-- END: Header -->
        <!-- BEGIN: PaymentToggle -->
        <div class="px-6 mb-4" data-purpose="payment-type-toggle">
            <div class="bg-mint-light/30 p-1.5 rounded-full flex gap-2">
                <button
                    class="flex-1 py-2 px-4 text-sm font-medium text-text-muted rounded-full hover:bg-white/50 transition-all">
                    Tiền mặt
                </button>
                <button
                    class="flex-1 py-2 px-4 text-sm font-semibold text-white bg-mint-primary rounded-full shadow-md">
                    Chuyển khoản VietQR
                </button>
            </div>
        </div>
        <!-- END: PaymentToggle -->
        <!-- BEGIN: QRSection -->
        <div class="px-6 mb-4">
            <div class="bg-white border border-gray-100 rounded-3xl p-8 flex flex-col items-center shadow-inner"
                data-purpose="qr-display-container">
                <!-- QR Code Placeholder -->
                <div class="relative w-48 h-48 mb-8">
                    <img alt="VietQR Code" class="w-full h-full object-contain" id="TEMP_QR_CODE"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBu60vY-bT9ABoYnfDtJpCZbj-DtfHruy7JMWYoOl3Y6hy8AzibM3D4qYKkRdgU0KqbztJWD21Uxsqi3eiIlSvMu7HCeFA3MHY4rcwcVYFnuaUwDC6rdpCaZ_W2BhtVfSNQYLuRv4Fgs8RBWbgitjFGJNh3sHDFHxHZxGz_7Gxfjr1jo7aXPF7p96dw5UrWYf64ia9OZzsavD2VoCRdTsrLeKYTU6vorf_aaeGM_snot7lIwPocBBlhq3IcNCSNNRsh6hRakhL5NCA" />
                    <!-- Small VietQR Logo Overlay (Represented by text) -->

                </div>
                <!-- Pulse Animation & Status -->
                <div class="flex flex-col items-center gap-4">
                    <div class="pulse-ring">
                        <div class="border-mint-primary"></div>
                        <div class="border-mint-primary"></div>
                        <!-- Center circle -->
                        <div
                            class="absolute inset-0 m-auto w-8 h-8 bg-mint-primary rounded-full !animate-none border-none">
                        </div>
                    </div>
                    <p class="text-sm font-medium text-text-dark">Waiting for payment...</p>
                </div>
            </div>
        </div>
        <!-- END: QRSection -->
        <!-- BEGIN: SettlementDetails -->
        <section class="px-6 mb-4" data-purpose="amount-summary">
            <div class="bg-gray-50/50 rounded-2xl p-5 border border-gray-100 flex justify-between items-start">
                <div>
                    <p class="text-xs font-semibold text-text-muted uppercase tracking-wider mb-1">Amount to Settle:</p>
                    <p class="text-2xl font-black text-text-dark">250.000 VNĐ</p>
                    <p class="text-sm text-text-muted mt-1">Trip to Da Nang</p>
                </div>
                <div class="bg-white p-2 rounded-lg shadow-sm"><span
                        class="material-symbols-outlined text-gray-400">group</span></div>
            </div>
        </section>
        <!-- END: SettlementDetails -->
        <!-- BEGIN: RecipientInfo -->
        <div class="px-6 mb-8 flex items-center gap-3" data-purpose="recipient-footer">
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm">
                <img alt="Minh" class="w-full h-full object-cover" id="TEMP_PROFILE_PIC"
                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuB1iIWQrlSzSX3lmzgHkyNzWXoXKw1UKJr10paHozNVxaxGepwYAdWWqznX3TtpLChY_4qviGtCrfh8DMjcQ2cXpe9EKjQVoz6_j0lD75qCGbod-i8gHmop8QzT-Td0pngGHnVNftgXEh9pBRFvU7j8MYTgg9GlI33bhrT7O4iernVTI0GIMbz0t0mz910yMPQ8Lzy1cT8LB_sVThOkfsjswx61aI58bNTvtiFXacaFdhEpDz_c7PIGcRVwhIFYau3SrXAU_jH_OOU" />
            </div>
            <p class="text-sm text-text-dark">To: <span class="font-bold">Minh</span></p>
        </div>
        <!-- END: RecipientInfo -->
        <!-- BEGIN: FooterAction -->
        <footer class="px-6 pb-10">
            <button
                class="w-full bg-mint-primary hover:bg-[#6BC4AB] text-white font-bold py-4 rounded-3xl shadow-lg shadow-mint-primary/20 transition-colors text-lg"
                data-purpose="confirm-button">
                Confirm Payment
            </button>
        </footer>
        <!-- END: FooterAction -->
    </main>
    <!-- END: MainContainer -->
</body>

</html>
