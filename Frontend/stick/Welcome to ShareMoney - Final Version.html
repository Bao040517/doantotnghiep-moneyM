<!DOCTYPE html>

<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ShareMoney - Welcome</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sharemoney-primary': '#6ebda9', // Main button color
                        'sharemoney-heading': '#437d6e', // Darker teal for headings
                        'sharemoney-bg-start': '#e0f7f3', // Light teal gradient start
                        'sharemoney-bg-end': '#d1f0ea',   // Light teal gradient end
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Styles for Background and Typography -->
    <style data-purpose="layout-styles">
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .app-container {
            background: linear-gradient(to bottom, #e2f8f4 0%, #cff1e9 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="antialiased text-sharemoney-heading">
    <!-- BEGIN: MainContainer -->
    <div class="app-container relative w-full max-w-md mx-auto shadow-2xl overflow-hidden" data-purpose="mobile-frame">
        <!-- BEGIN: iOSStatusBar -->
        <header class="flex justify-between items-center px-6 pt-4 pb-2 text-sm font-semibold"
            data-purpose="status-bar">
            <div class="flex items-center space-x-1">
                <span>Ontrev</span>
                <svg class="w-4 h-4" fill="currentColor" viewbox="0 0 20 20">
                    <path
                        d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z">
                    </path>
                </svg>
            </div>
            <div>9:41 AM</div>
            <div class="flex items-center space-x-1">
                <span>100%</span>
                <div class="w-6 h-3 border border-current rounded-sm relative px-0.5">
                    <div class="bg-current h-full w-full rounded-px"></div>
                    <div class="absolute -right-1 top-1 w-0.5 h-1 bg-current rounded-r-full"></div>
                </div>
            </div>
        </header>
        <!-- END: iOSStatusBar -->
        <!-- BEGIN: MainContent -->
        <main class="flex-grow flex flex-col items-center px-8 pt-12 text-center" data-purpose="content-area">
            <!-- Welcome Text -->
            <p class="text-lg font-medium mt-6 mb-2 opacity-90 text-sharemoney-heading" data-purpose="sub-welcome">
                Welcome to ShareMoney
            </p>
            <!-- Main Heading -->
            <h1 class="text-[40px] font-extrabold leading-tight mb-4 text-sharemoney-heading text-center"
                data-purpose="main-headline">Chia tiền không<br />sứt mẻ tình anh em</h1>
            <!-- Illustration Container -->
            <div class="w-full flex-1 min-h-[250px] bg-no-repeat bg-center bg-contain my-4 drop-shadow-xl"
                style="background-image: url('welcome-bg.png');" data-purpose="illustration-wrapper">
            </div>
        </main>
        <!-- END: MainContent -->
        <!-- BEGIN: FooterActions -->
        <footer class="px-8 pb-8 flex flex-col space-y-4 w-full" data-purpose="action-buttons">
            <!-- Primary Action Button -->
            <button
                class="w-full bg-sharemoney-primary text-white py-5 rounded-full text-xl font-bold shadow-lg hover:brightness-105 active:scale-95 transition-all"
                data-purpose="primary-button" id="btn-get-started">
                Bắt đầu ngay
            </button>
            <!-- Secondary Link -->
            <button class="w-full text-sharemoney-heading text-xl font-bold hover:opacity-80 transition-opacity"
                data-purpose="secondary-link" id="btn-login">
                Đăng nhập
            </button>
        </footer>
        <!-- END: FooterActions -->
    </div>
    <!-- END: MainContainer -->
    <!-- JavaScript for Basic Interactivity (Optional) -->
    <script data-purpose="interaction-logic">
        document.getElementById('btn-get-started').addEventListener('click', () => {
            console.log('Navigating to onboarding...');
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            console.log('Navigating to login...');
        });
    </script>
</body>

</html>
