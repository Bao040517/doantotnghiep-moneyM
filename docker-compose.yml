version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sharemoney_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: share-money
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sharemoney_backend
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
      - DB_USER=${DB_USER:-postgres.yzocyymegnmqkncdprkl}
      - DB_PASSWORD=${DB_PASSWORD:-0986523787Bao@}
      - DB_MAX_POOL_SIZE=${DB_MAX_POOL_SIZE:-5}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-9X631XJB}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-LLYQDNXPRMCBUAUKCZPSUXKOMDZDCXFP}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-f0eb6860-35ac-443b-abe4-420c5bf8914e}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-692788be-837f-4ad0-9026-5e5acd25e85b}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-e003b853f0539e62a405c40711a39f0c8f47c70f1da499cbb97e7342409649ca}
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:

