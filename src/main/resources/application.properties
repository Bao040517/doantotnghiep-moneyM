# =============================================
# ShareMoney - Application Properties
# =============================================
# SAO CHÉP file này thành application-local.properties
# và điền thông tin PostgreSQL của bạn vào

# --- Server ---
server.port=8080

# --- DataSource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/share-money}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: tạo bảng nếu chưa có, không xoá data cũ
# create: xoá toàn bộ bảng và tạo lại mỗi lần start (dùng khi reset DB)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Jackson (tránh vòng lặp serialize bidirectional) ---
spring.jackson.serialization.fail-on-empty-beans=false

# --- AI Gemini API ---
# Thay thế bằng API Key thật của bạn từ https://aistudio.google.com/
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# --- Mindee Receipt OCR API ---
# Lấy API Key miễn phí tại https://platform.mindee.com/
mindee.api.key=${MINDEE_API_KEY:}
mindee.api.url=https://api.mindee.net/v1/products/mindee/expense_receipts/v5/predict

# --- JWT Config ---
# Secret key nên có độ dài >= 256 bits (32 ký tự). Tạo 1 chuỗi random base64.
# (Có default value để chạy local development, khi lên production cần truyền env JWT_SECRET)
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
jwt.expiration=86400000

# --- CORS ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# --- Rate Limiting ---
rate.limit.requests-per-minute=300
rate.limit.auth.requests-per-minute=10

# --- Swagger (disable via env or profile) ---
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# --- VNPay Sandbox ---
vnpay.tmnCode=${VNPAY_TMN_CODE:9X631XJB}
vnpay.hashSecret=${VNPAY_HASH_SECRET:LLYQDNXPRMCBUAUKCZPSUXKOMDZDCXFP}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
