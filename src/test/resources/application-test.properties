# Test Profile — Dùng H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=test-secret-key-for-unit-tests-only-must-be-at-least-256-bits-long-0123456789
jwt.expiration=3600000

# Disable external APIs
gemini.api.key=

# Rate Limiting (tăng cao cho tests)
rate.limit.requests-per-minute=1000
rate.limit.auth.requests-per-minute=1000

# CORS
cors.allowed-origins=http://localhost:3000
